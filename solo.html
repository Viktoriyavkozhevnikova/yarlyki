<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Своя игра: Ярлыки. Онлайн</title>
<style>
:root{
 --bg:#F4EDE4; --card:#FFFFFF; --ink:#2B1B22; --berry:#6D2E46; --berry2:#8C4A63;
 --gold:#C9A227; --muted:#7A6A70; --line:#E3D6C8; --good:#2E7D4F; --bad:#B3402E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
#app{max-width:760px;width:100%}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-size:16px}
.btn{background:var(--berry);color:#fff;padding:12px 22px}
.btn:hover{background:var(--berry2)}
.btn.sec{background:transparent;color:var(--berry);border:1.5px solid var(--berry)}
.btn.gold{background:var(--gold);color:#2B1B22}
.btn:disabled{opacity:.4;cursor:default}
h1{color:var(--berry);letter-spacing:.04em;font-size:clamp(22px,4vw,32px);text-align:center;margin:10px 0 6px}
.sub{text-align:center;color:var(--muted);font-size:14.5px;margin-bottom:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.hint{color:var(--muted);font-size:14.5px;line-height:1.6;margin:10px 0}
input[type=text],input[type=number]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--ink);font-family:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.statusbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-family:Arial,sans-serif;font-size:13px;color:var(--muted)}
.statusbar b{color:var(--berry);font-size:16px}
.timer{font-size:20px;font-weight:bold;color:var(--berry);min-width:48px;text-align:right}
.timer.low{color:var(--bad)}
.theme{font-family:Arial,sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.qtext{font-size:clamp(17px,2.6vw,21px);line-height:1.5;margin-bottom:18px}
.x2{display:inline-block;font-family:Arial,sans-serif;font-size:12px;letter-spacing:.08em;background:var(--gold);color:#2B1B22;border-radius:999px;padding:3px 12px;margin-bottom:10px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;font-size:16px;line-height:1.4;color:var(--ink)}
.opt:hover{border-color:var(--berry)}
.opt.correct{background:#e4f2e8;border-color:var(--good)}
.opt.wrong{background:#f7e4e0;border-color:var(--bad)}
.opt:disabled{cursor:default;opacity:.85}
.expl{border-left:4px solid var(--berry);background:var(--bg);border-radius:8px;padding:12px 16px;margin-top:14px;color:var(--muted);font-size:14.5px;line-height:1.55}
.expl b{color:var(--berry)}
.delta{font-weight:bold}
.delta.plus{color:var(--good)}.delta.minus{color:var(--bad)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--berry)}
table{width:100%;border-collapse:collapse;margin-top:12px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{font-family:Arial,sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.big{font-size:clamp(34px,7vw,54px);color:var(--berry);font-weight:bold;text-align:center;margin:10px 0}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.2em;background:var(--bg);border:1px dashed var(--berry);border-radius:10px;padding:10px 16px;text-align:center;margin:12px auto;max-width:300px}
details{margin:12px 0}summary{color:var(--berry);cursor:pointer;font-weight:bold}
.center{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const DATA={"rounds":[{"title":"Классика жанра","base":100,"themes":[{"t":"Старые знакомые","q":[{"q":"Не начинает работу без многократных напоминаний, бросает начатое, выбирает самое короткое задание, на уроке смотрит в окно или в телефон.","a":"Лентяй","d":["Выскочка","Зубрилка","Растяпа"],"c":"Главный ярлык-обманка словаря: за отказом начинать почти всегда стоит опыт неудачи — безопаснее не начинать, чем снова не справиться.","x2":false},{"q":"Тянет руку на каждый вопрос, выкрикивает ответ с места, первым вызывается на любое задание и заметно переживает, если выбрали другого.","a":"Выскочка","d":["Лентяй","Зубрилка","Растяпа"],"c":"Окружающих раздражают не ответы, а постоянное «я, я, я» — гипертрофированная потребность в признании.","x2":false},{"q":"Учит всё подряд и дословно, отвечает близко к тексту учебника, паникует при вопросе «а своими словами?», отказывается от прогулки перед контрольной.","a":"Зубрилка","d":["Лентяй","Выскочка","Растяпа"],"c":"Ярлык наказывает ребёнка за старательность — и потому особенно несправедлив.","x2":false},{"q":"Роняет, разливает, разбивает; падает на ровном месте; слово закрепляется после двух-трёх заметных эпизодов — и дальше сопровождает каждый, даже случайный, промах.","a":"Растяпа","d":["Лентяй","Выскочка","Зубрилка"],"c":"Пример избыточной стабильности ярлыка: поведение эпизодично, имя постоянно.","x2":false},{"q":"Отвечает с паузой, последним заканчивает работу, не сразу понимает шутку, переспрашивает — а нередко понимает глубже всех.","a":"Тормоз","d":["Лентяй","Выскочка","Зубрилка"],"c":"Ярлык наказывает за темп — характеристику нейродинамики, которую человек не выбирает.","x2":false}]},{"t":"Тише воды","q":[{"q":"Сидит на одном месте всю перемену, говорит только когда спросят, не участвует в шалостях и конфликтах, не просит и не жалуется.","a":"Тихоня","d":["Стеснительный","Интроверт","Неразговорчивый"],"c":"В устах учителя звучит почти одобрительно («с ним нет хлопот») — и в этом ловушка: это маска «невидимки».","x2":false},{"q":"Краснеет и сбивается при ответе у доски, говорит тихо, не подходит первым, а на похвалу при всех реагирует как на наказание.","a":"Стеснительный","d":["Тихоня","Интроверт","Неразговорчивый"],"c":"Публичность для него — нагрузка, а не награда.","x2":false},{"q":"На перемене остаётся за партой с книгой, в большой компании молчит, дружит с одним-двумя. Единственный ярлык списка, который наука вообще не считает недостатком.","a":"Интроверт","d":["Тихоня","Стеснительный","Неразговорчивый"],"c":"Нормальная характеристика темперамента, а не изъян. Иногда ярлык неправ целиком.","x2":false},{"q":"Отвечает односложно, сам разговор не начинает, в дискуссии отмалчивается, при прямом обращении смущается и сворачивает ответ.","a":"Неразговорчивый","d":["Тихоня","Стеснительный","Интроверт"],"c":"Пересекается с маской «невидимки»: не проявляться — способ не попасть под удар.","x2":false},{"q":"Не поднимает руку, не предлагает ничего в групповой работе, делает ровно то, что сказано; на вопрос «что ты сам хочешь?» пожимает плечами.","a":"Безынициативный (пассивный)","d":["Тихоня","Стеснительный","Интроверт"],"c":"Часто это не отсутствие желаний, а выученная осторожность: инициатива когда-то наказывалась.","x2":false}]},{"t":"Громкие роли","q":[{"q":"Кривляется у доски, передразнивает интонации, отвечает так, чтобы рассмеялся класс, срывает серьёзные моменты репликой.","a":"Клоун (шут)","d":["Болтливый","Всезнайка","Хвастун"],"c":"Маска «клоунада»: быть смешным безопаснее, чем быть неуспешным — смеются по его сценарию.","x2":false},{"q":"Говорит много и без пауз, перебивает, комментирует всё происходящее вслух; собеседнику трудно вставить слово.","a":"Болтливый","d":["Клоун (шут)","Всезнайка","Хвастун"],"c":"Простое описание поведения — редкий случай ярлыка почти без второго дна.","x2":false},{"q":"Отвечает раньше, чем спросили, поправляет одноклассников и учителя, к каждой теме добавляет «а я читал, что…».","a":"Всезнайка","d":["Клоун (шут)","Болтливый","Хвастун"],"c":"Знания предъявляет как превосходство, а не как вклад в общий разговор.","x2":false},{"q":"Рассказывает о покупках, поездках, оценках и подписчиках с расчётом на реакцию, преувеличивает, чужие достижения перебивает своими.","a":"Хвастун","d":["Клоун (шут)","Болтливый","Всезнайка"],"c":"Сравнение всегда в свою пользу: «а у меня лучше».","x2":false},{"q":"Реагирует на отказ или двойку слезами, криком, хлопаньем дверью; эмоция вспыхивает мгновенно и непропорционально поводу.","a":"Истеричка","d":["Клоун (шут)","Болтливый","Всезнайка"],"c":"Ярлык, как правило, достаётся девочкам и фиксирует не «характер», а несформированную саморегуляцию — сигнал для взрослого.","x2":true}]},{"t":"Трудные характеры","q":[{"q":"Жалуется до начала дела: «опять контрольная», «у меня не получится», «почему всегда я»; энергия уходит в жалобу, а не в действие.","a":"Нытик","d":["Раздражительный","Паникёр","Пессимист"],"c":"В любом событии первым находит плохое.","x2":false},{"q":"Вспыхивает от мелочи: огрызается на просьбу подвинуться, хлопает учебником; после вспышки быстро остывает, но осадок у окружающих накапливается.","a":"Раздражительный","d":["Нытик","Паникёр","Пессимист"],"c":"Короткая вспышка — длинный след.","x2":false},{"q":"При любом изменении планов задаёт тревожные вопросы по кругу («а вдруг…», «а если…»), заражает беспокойством соседей, преувеличивает последствия.","a":"Паникёр","d":["Нытик","Раздражительный","Пессимист"],"c":"Перед контрольной накручивает не только себя, но и других.","x2":false},{"q":"В любом плане первым называет причины, по которым ничего не выйдет; успех объясняет случайностью, неудачу — закономерностью.","a":"Пессимист","d":["Нытик","Раздражительный","Паникёр"],"c":"Фирменная реплика: «да кому это надо».","x2":false},{"q":"Не меняет решения после контраргументов, спорит из принципа, «нет» говорит раньше, чем выслушает.","a":"Упёртый (упрямый)","d":["Нытик","Раздражительный","Паникёр"],"c":"Ключ из тетради: часто это не спор о предмете, а борьба за право выбирать — дефицит контроля.","x2":false}]},{"t":"Угадай по трём признакам","q":[{"q":"Мятая одежда — неубранный портфель — парта в обрезках и крошках.","a":"Грязнуля","d":["Жадный","Неорганизованный (несобранный)","Невнимательный"],"c":"Для педагога устойчивая неопрятность — не повод для клейма, а наблюдаемый факт, который может говорить о домашней ситуации.","x2":false},{"q":"Спрятанный ластик — неодолженная ручка — последнее и минимальное участие в складчине.","a":"Жадный","d":["Грязнуля","Неорганизованный (несобранный)","Невнимательный"],"c":"Не делится и не даёт своего.","x2":false},{"q":"Забытая сменка — потерянный листок с заданием — портфель, который собирается, когда уже пора выходить.","a":"Неорганизованный (несобранный)","d":["Грязнуля","Жадный","Невнимательный"],"c":"Дела делаются в случайном порядке, и ни одно не доводится к сроку.","x2":true},{"q":"Пропущенное условие задачи — ошибки «на ровном месте» — потерянные вещи.","a":"Невнимательный","d":["Грязнуля","Жадный","Неорганизованный (несобранный)"],"c":"Устойчивая рассеянность — повод не для замечаний, а для вопроса, чем на самом деле занята голова ребёнка.","x2":false},{"q":"Переспрашивает объяснённое — путает порядок действий — старается, и всё равно делает не то.","a":"Бестолковый","d":["Грязнуля","Жадный","Неорганизованный (несобранный)"],"c":"Ярлык фиксирует результат, но прячет причину: перегрузку, тревогу или пробел в базовых знаниях.","x2":false}]}]},{"title":"Новый словарь","base":200,"themes":[{"t":"Сленг для начинающих","q":[{"q":"Поправляет мелкие ошибки, требует соблюдения правил там, где все договорились их не замечать, продолжает спор, когда всем стало скучно, объясняет шутку.","a":"Душнила","d":["Кринж (кринжовый)","Краш","Токсик (токсичный)"],"c":"Самый частотный ярлык собранного словаря. «Душнилой» можно стать, просто оказавшись правым не вовремя.","x2":false},{"q":"Так называют того, кто вызывает «испанский стыд»: ведёт себя не по ситуации и не замечает этого — шутит несмешное, использует устаревший сленг, слишком старается понравиться.","a":"Кринж (кринжовый)","d":["Душнила","Краш","Токсик (токсичный)"],"c":"Ярлык фиксирует не поведение, а реакцию зрителей.","x2":false},{"q":"Не характеристика поведения, а роль в чужих чувствах: человек, который нравится. Этот «статус» получают без всякого собственного действия.","a":"Краш","d":["Душнила","Кринж (кринжовый)","Токсик (токсичный)"],"c":"За внешность, манеру держаться, голос.","x2":false},{"q":"Обесценивает («ничего особенного»), язвит под видом честности, давит на чувство вины; после общения с ним остаётся усталость и ощущение собственной никчёмности.","a":"Токсик (токсичный)","d":["Душнила","Кринж (кринжовый)","Краш"],"c":"Слово стало универсальным упрёком — им всё чаще метят любого неудобного собеседника.","x2":false},{"q":"Добивается внимания, принижая себя или «своих»: «я не такая, как все девочки», наперебой соглашается, выслуживается перед популярными.","a":"Пикми","d":["Душнила","Кринж (кринжовый)","Краш"],"c":"От англ. pick me — «выбери меня». За показной скромностью — громкая заявка на исключительность.","x2":false}]},{"t":"Из игр и сети","q":[{"q":"«Фоновый» человек: отвечает заученными фразами, не имеет своего мнения, действует по шаблону. Название — из видеоигр.","a":"НПС (NPC)","d":["Ларпер (ларп)","Флудер","Щитпостер"],"c":"Non-player character. Один из самых обесчеловечивающих ярлыков словаря: отказывает не в качестве, а в субъектности.","x2":false},{"q":"Изображает жизнь, которой не живёт: «отыгрывает» богатство, связи, суровый опыт. Название — из ролевых игр живого действия.","a":"Ларпер (ларп)","d":["НПС (NPC)","Флудер","Щитпостер"],"c":"Live action role play. Несоответствие образа и реальности рано или поздно вскрывается.","x2":false},{"q":"Заваливает чат сообщениями не по делу: пересылает десятки картинок, пишет односложные реплики подряд; важное в его потоке тонет.","a":"Флудер","d":["НПС (NPC)","Ларпер (ларп)","Щитпостер"],"c":"От flood — «наводнение».","x2":false},{"q":"Намеренно публикует абсурдный, низкокачественный контент; юмор строится на самой нелепости. От флудера отличается осознанностью жанра.","a":"Щитпостер","d":["НПС (NPC)","Ларпер (ларп)","Флудер"],"c":"Жанровое интернет-слово: нелепость здесь — художественный приём.","x2":false},{"q":"Пишет и говорит то, что выведет из себя, ради самой реакции; добившись вспышки, отступает со словами «да я же шучу».","a":"Тролль","d":["НПС (NPC)","Ларпер (ларп)","Флудер"],"c":"Спор для него — развлечение, а не поиск правоты.","x2":true}]},{"t":"Свои и чужие","q":[{"q":"Одеждой, причёской, музыкой и символикой демонстрирует принадлежность к субкультуре и непринадлежность к большинству.","a":"Нефор","d":["Нормис","Позер","Тру"],"c":"Сокращение от «неформал». Описывает внешнюю презентацию, а не поступки.","x2":false},{"q":"Человек без выраженных особенностей: массовые вкусы, предсказуемые реакции, «как все». В устах субкультурных подростков звучит снисходительно.","a":"Нормис","d":["Нефор","Позер","Тру"],"c":"За словом почти нет поведения — есть отсутствие отличий.","x2":false},{"q":"Носит атрибутику субкультуры, не зная её содержания, цитирует группу, не слушая её альбомов; «своими» распознаётся и отторгается.","a":"Позер","d":["Нефор","Нормис","Тру"],"c":"Имитация принадлежности знаками.","x2":false},{"q":"«Настоящий, подлинный»: тот, чья принадлежность — к субкультуре, увлечению, дружбе — подтверждена делом, а не атрибутикой.","a":"Тру","d":["Нефор","Нормис","Позер"],"c":"От англ. true. Антоним позёра и ларпера.","x2":false},{"q":"Во всём придерживается одобряемых группой «правильных» взглядов и вкусов: повторяет общепринятые мнения, слушает то, что все, носит то, что все.","a":"Базовичок","d":["Нефор","Нормис","Позер"],"c":"От слова «база». Звучит и одобрительно, и с иронией — «без собственной позиции».","x2":false}]},{"t":"Образы и позы","q":[{"q":"Образ «одинокого волка»: демонстративно независим, держится вне компаний и как бы над ними, равнодушен к мнению группы.","a":"Сигма","d":["Дед инсайд","Думер","Скуф"],"c":"В подростковой практике чаще означает не реальную самодостаточность, а её старательное изображение.","x2":false},{"q":"«Мёртвый внутри»: тёмная одежда, грустные статусы, подчёркнутое равнодушие, эстетизация тоски.","a":"Дед инсайд","d":["Сигма","Думер","Скуф"],"c":"Важно различать позу субкультуры и реальные признаки депрессивного состояния (об этом — в раунде 5).","x2":false},{"q":"Носитель уныло-обречённого взгляда на будущее: «всё бессмысленно, ничего не изменить»; не строит планов, романтизирует собственную тоску.","a":"Думер","d":["Сигма","Дед инсайд","Скуф"],"c":"От англ. doom — «гибель, рок».","x2":false},{"q":"Обидное слово о взрослом, опустившем планку: неухоженность, диван, раздражительность, «раньше было лучше». Подростки переносят его и на сверстников.","a":"Скуф","d":["Сигма","Дед инсайд","Думер"],"c":"Переносится на сверстников за неопрятность и «стариковское» брюзжание.","x2":true},{"q":"Образ напористого, физически уверенного «альфы»: качается, легко знакомится, не сомневается в себе. Употребляется и с восхищением, и с иронией.","a":"Чад","d":["Сигма","Дед инсайд","Думер"],"c":"Ирония направлена на сам стереотип «альфы».","x2":false}]},{"t":"Отношения и флаги","q":[{"q":"Не человек, а признак: поведение, которое группа договорилась считать предупреждением об опасности в отношениях — ревнует, проверяет телефон, не принимает «нет».","a":"Ред флаг","d":["Гринфлаг","Вайбовый (вайбуля)","Масик"],"c":"«Ходячим ред флагом» называют того, у кого таких признаков много.","x2":false},{"q":"Антоним предыдущего: тот, чьё поведение группа считает признаком надёжности — отвечает на сообщения, держит слово, спокойно принимает отказ.","a":"Гринфлаг","d":["Ред флаг","Вайбовый (вайбуля)","Масик"],"c":"Редкий пример одобрительного ярлыка с поведенческим содержанием.","x2":false},{"q":"Человек, с которым «совпадает атмосфера»: легко подхватывает настроение компании, с ним комфортно молчать и шутить.","a":"Вайбовый (вайбуля)","d":["Ред флаг","Гринфлаг","Масик"],"c":"Комплиментарный ярлык — но и он описывает не поступки, а ощущение от человека.","x2":false},{"q":"Ласково-ироничное: мягкий, заботливый, уступчивый мальчик — носит сумку, соглашается, опекает.","a":"Масик","d":["Ред флаг","Гринфлаг","Вайбовый (вайбуля)"],"c":"В зависимости от интонации — одобрение или намёк на бесхарактерность.","x2":false},{"q":"Систематически и публично критикует одного и того же человека: под каждым успехом пишет «ничего особенного», радуется неудачам.","a":"Хейтер","d":["Ред флаг","Гринфлаг","Вайбовый (вайбуля)"],"c":"Критика не предполагает улучшения — только принижение. Чем отличается от тролля — вопрос раунда 4.","x2":false}]}]},{"title":"Откуда что взялось","base":300,"themes":[{"t":"География и сцена","q":[{"q":"Почему дальние парты в классе называют именно «Камчаткой»?","a":"Самый дальний край страны","d":["Самое холодное место в классе","По фамилии знаменитого двоечника","Из названия кинофильма"],"c":"Дальняя окраина карты стала дальней окраиной класса: туда «ссылают». Образ встречается в русской литературе с XIX века.","x2":false},{"q":"Из какого искусства пришла насмешка «умирающий лебедь» — и чьё имя носит породившая её миниатюра?","a":"Из балета — миниатюра Михаила Фокина","d":["Из оперы П. И. Чайковского","Из басни Крылова","Из мультфильма о гадком утёнке"],"c":"Создана для Анны Павловой на музыку Сен-Санса. Ирония учителя невольно цитирует высокую классику.","x2":false},{"q":"Откуда в школьную речь пришло слово «галёрка»?","a":"Из театра — верхний ярус зала (галерея)","d":["С флота — нижняя палуба галеры","Из тюремного жаргона","От слова «галерея магазина»"],"c":"Самые дешёвые и дальние места; школьная «галёрка» унаследовала и расположение, и репутацию.","x2":false},{"q":"Из чего пришла формула «сладкая парочка», которой дразнят двух неразлучных?","a":"Из рекламы шоколадного батончика","d":["Из детской песни","Из кулинарной телепередачи","Из мультфильма"],"c":"Рекламный слоган 1990-х. Ярлык иронизирует над самой привязанностью и вынуждает либо стесняться её, либо демонстративно порвать.","x2":false},{"q":"За что на самом деле наказывает ярлык «слон в посудной лавке»?","a":"За телесность: размер и сила опережают самоконтроль","d":["За намеренную порчу вещей","За жадность","За медлительность"],"c":"Размер и сила опережают координацию и самоконтроль — то, что ребёнок контролирует меньше всего.","x2":false}]},{"t":"Слова с биографией","q":[{"q":"Этот сериал вернул в школьные коридоры слово «чушпан».","a":"«Слово пацана»","d":["«Бригада»","«Физрук»","«Трудные подростки»"],"c":"Экран реанимировал лексику уличных иерархий сорокалетней давности.","x2":false},{"q":"В какой стране и за что слово «тунеядец» было официальным клеймом с правовыми последствиями?","a":"В СССР — за «жизнь без общественно полезного труда»","d":["В Российской империи — за неуплату податей","В Польше — за отказ от службы","Нигде: слово всегда было только бытовым"],"c":"Административное преследование «ведущих паразитический образ жизни». В учительской речи слово пережило свою эпоху.","x2":false},{"q":"Кого метит слово «лимита» — и какую динамику в группе оно маркирует?","a":"Приезжего; ксенофобную динамику в группе","d":["Отличника; зависть к успеху","Новичка; обряд посвящения","Медлительного; нетерпимость к темпу"],"c":"Поведения адресата здесь почти нет — есть происхождение. Требует внимания взрослого.","x2":true},{"q":"От какого слова образовано «офник» — и что за среда за ним стоит?","a":"«Околофутбольщик» — агрессивная уличная среда","d":["«Офисник» — скучный человек","«Официальный» — любимчик администрации","От англ. off — «отключённый от жизни»"],"c":"Устойчивая самопрезентация такого рода — повод для внимания взрослых: за позой может стоять реальная вовлечённость.","x2":false},{"q":"«Шестёрка»: какое положение ребёнка в группе описывает это слово — и чем оно является для педагога?","a":"Зависимое положение; повод для помощи","d":["Лидерское положение; повод для гордости","Шутовское амплуа; повод const LSKEY='yarlyki-solo-v1';
const TIME=60; // секунд на вопрос
let S=null,tick=null;
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function save(){try{localStorage.setItem(LSKEY,JSON.stringify(S));}catch(e){}}
function load(){try{const x=localStorage.getItem(LSKEY);return x?JSON.parse(x):null;}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(LSKEY);}catch(e){}}
function stopTimer(){if(tick){clearInterval(tick);tick=null;}}
// Детерминированный код результата
function resCode(name,score){
 let h=2166136261;const s=(name.trim().toLowerCase()+'|'+score+'|yarlyki');
 for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
 return h.toString(36).toUpperCase().padStart(7,'0').slice(-7);
}
function totalQ(){return DATA.rounds.reduce((s,R)=>s+R.themes.reduce((x,t)=>x+t.q.length,0),0);}
function flat(r){const a=[];DATA.rounds[r].themes.forEach((t,ti)=>t.q.forEach((q,qi)=>a.push({t:t.t,ti,qi,...q})));return a;}
function newState(name){return{stage:'intro',name,score:0,r:0,i:0,rScore:[0,0,0,0,0],rRight:[0,0,0,0,0],bet:null,finDone:false};}

 app.innerHTML=`
 <div class="statusbar">
  <span>Раунд ${S.r+1} · вопрос ${doneQ+1}/${allQ}</span>
  <span><b>${S.score}</b> очков</span>
  <span class="timer" id="tm">${left}</span>
 </div>
 <div class="progress"><i style="width:${Math.round(100*doneQ/allQ)}%"></i></div>
 <div class="panel">
  <div class="theme">${esc(Q.t)} · номинал ${nom}</div>
  ${Q.x2?'<span class="x2">×2 · ДВОЙНЫЕ ОЧКИ</span>':''}
  <div class="qtext">${esc(Q.q)}</div>
  <div class="opts" id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>
  <div id="after"></div>
 </div>`;
 const tm=document.getElementById('tm');
 tick=setInterval(()=>{left--;tm.textContent=left;if(left<=10)tm.classList.add('low');
  if(left<=0){stopTimer();finish(null);}},1000);
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(!answered){stopTimer();finish(+b.dataset.i);}});
 function finish(pick){
  if(answered)return;answered=true;
  const okIdx=opts.findIndex(o=>o.ok);
  const right=pick===okIdx;
  const delta=right?nom:-nom;
  S.score+=delta;S.rScore[S.r]+=delta;if(right)S.rRight[S.r]++;
  const sb=document.querySelector('.statusbar b');if(sb)sb.textContent=S.score;
  document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;
   if(i===okIdx)b.classList.add('correct');
   else if(i===pick)b.classList.add('wrong');});
  document.getElementById('after').innerHTML=`
   <div class="expl"><b>${esc(Q.a)}.</b> ${esc(Q.c)}<br>
   <span class="delta ${right?'plus':'minus'}">${right?'+':''}${delta}</span>${pick==null?' · время вышло':''}</div>
   <div class="row"><button class="btn" id="next">Дальше →</button></div>`;
  document.getElementById('next').onclick=()=>{
   S.i++;
   if(S.i>=qs.length){S.stage='rsum';}
   save();render();
  };
  save();
 }
}
function renderRSum(){
 const R=DATA.rounds[S.r],last=S.r>=4;
 app.innerHTML=`
 <h1>Раунд ${S.r+1} пройден</h1>
 <div class="panel center">
  <p class="hint">Верных ответов: <b>${S.rRight[S.r]}</b> из 25 · очки за раунд: <b>${S.rScore[S.r]>0?'+':''}${S.rScore[S.r]}</b></p>
  <div class="big">${S.score}</div>
  <p class="hint">общий счёт</p>
  <button class="btn" id="next">${last?'К финалу →':'Раунд '+(S.r+2)+' →'}</button>
 </div>`;
 document.getElementById('next').onclick=()=>{
  if(last){S.stage='finbet';}else{S.r++;S.i=0;S.stage='intro';}
  save();render();
 };
}
function renderFinBet(){
 const max=Math.max(0,S.score);
 app.innerHTML=`
 <h1>ФИНАЛ</h1>
 <p class="sub">Тема: «${esc(DATA.final.theme)}»</p>
 <div class="panel">
  <p class="hint">Сделайте ставку — от 0 до вашего счёта${S.score<=0?' (счёт не положительный, вы играете ради ответа: ставка 0)':''}. Верный ответ прибавит ставку, неверный — отнимет.</p>
  <input type="number" id="bet" min="0" max="${max}" step="100" value="${Math.min(max,Math.max(0,Math.round(max/2/100)*100))}" ${max===0?'disabled':''}>
  <div class="row"><button class="btn gold" id="go">Открыть вопрос финала</button></div>
 </div>`;
 document.getElementById('go').onclick=()=>{
  const v=Math.min(max,Math.max(0,Math.round(+document.getElementById('bet').value||0)));
  S.bet=v;S.stage='finq';save();render();
 };
}
function renderFinQ(){
 const F=DATA.final;
 const opts=[{t:F.a,ok:true},...F.d.map(t=>({t,ok:false}))];
 for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
 let left=90,answered=false;
 app.innerHTML=`
 <div class="statusbar"><span>Финал · ставка ${S.bet}</span><span><b>${S.score}</b> очков</span><span class="timer" id="tm">${left}</span></div>
 <div class="panel">
  <div class="theme">${esc(F.theme)}</div>
  <div class="qtext">${esc(F.q)}</div>
  <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>
  <div id="after"></div>
 </div>`;
 const tm=document.getElementById('tm');
 tick=setInterval(()=>{left--;tm.textContent=left;if(left<=10)tm.classList.add('low');
  if(left<=0){stopTimer();fin(null);}},1000);
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(!answered){stopTimer();fin(+b.dataset.i);}});
 function fin(pick){
  if(answered)return;answered=true;
  const okIdx=opts.findIndex(o=>o.ok),right=pick===okIdx;
  S.score+=right?S.bet:-S.bet;S.finDone=right;
  document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;
   if(i===okIdx)b.classList.add('correct');else if(i===pick)b.classList.add('wrong');});
  document.getElementById('after').innerHTML=`
   <div class="expl"><b>${esc(F.a)}.</b> ${esc(F.c)}<br>
   <span class="delta ${right?'plus':'minus'}">${right?'+':'−'}${S.bet}</span></div>
   <div class="row"><button class="btn gold" id="done">Итог →</button></div>`;
  document.getElementById('done').onclick=()=>{S.stage='done';save();render();};
  save();
 }
}
function renderDone(){
 const code=resCode(S.name,S.score);
 const right=S.rRight.reduce((a,b)=>a+b,0);
 app.innerHTML=`
 <h1>ИТОГ</h1>
 <div class="panel center">
  <p class="hint"><b>${esc(S.name)}</b> · верных ответов ${right} из ${totalQ()}${S.finDone?' · финал взят':''}</p>
  <div class="big">${S.score}</div>
  <div class="code">${code}</div>
  <p class="hint">Код результата: назовите его вместе с именем и счётом — любой сможет проверить результат кнопкой «Проверить код» на первом экране. Сравните счёт с другими участниками — у всех одинаковые вопросы.</p>
  <table><tr><th>Раунд</th><th>Верных</th><th>Очки</th></tr>
  ${DATA.rounds.map((R,i)=>`<tr><td>${i+1}. ${esc(R.title)}</td><td>${S.rRight[i]}/25</td><td>${S.rScore[i]>0?'+':''}${S.rScore[i]}</td></tr>`).join('')}
  </table>
  <div class="row" style="justify-content:center"><button class="btn sec" id="again">Сыграть заново</button></div>
 </div>`;
 document.getElementById('again').onclick=()=>{clearSave();renderStart();};
}
renderStart();
</script>
