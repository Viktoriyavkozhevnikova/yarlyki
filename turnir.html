<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Своя игра: Ярлыки. Турнир</title>
<style>
:root{
 --bg:#F4EDE4; --card:#FFFFFF; --ink:#2B1B22; --berry:#6D2E46; --berry2:#8C4A63; --rose:#A26769;
 --gold:#C9A227; --muted:#7A6A70; --line:#E3D6C8; --good:#2E7D4F; --bad:#B3402E; --celldone:#E9DFD3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:14px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-size:15px}
.btn{background:var(--berry);color:#fff;padding:10px 18px}
.btn:hover{background:var(--berry2)}
.btn.sec{background:transparent;color:var(--berry);border:1.5px solid var(--berry)}
.btn.gold{background:var(--gold);color:#2B1B22}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
h1{color:var(--berry);letter-spacing:.04em;font-size:clamp(20px,3.4vw,30px)}
.center{max-width:860px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rtitle{font-size:13px;color:var(--muted);font-family:Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
/* setup */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:15px;resize:vertical;background:var(--bg);color:var(--ink)}
.hint{color:var(--muted);font-size:14px;line-height:1.55;margin:10px 0}
details{margin:12px 0}
summary{color:var(--berry);cursor:pointer;font-weight:bold}
details p{margin:8px 0;color:var(--ink);font-size:14.5px;line-height:1.6}
/* board */
.board{display:grid;grid-template-columns:minmax(130px,1.1fr) repeat(5,1fr);gap:6px;margin-bottom:12px}
.thm{background:var(--berry);color:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:clamp(11px,1.5vw,14px);min-height:52px;font-family:Arial,sans-serif}
.cell{background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--berry);font-size:clamp(15px,2.2vw,22px);font-weight:bold;min-height:52px}
.cell:hover{background:#fff7ec}
.cell.done{background:var(--celldone);color:var(--muted);font-weight:normal;cursor:default;font-size:14px}
/* players */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:14px}
.chip b{font-family:Arial,sans-serif;font-size:13px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .sc{color:var(--berry);font-weight:bold;min-width:40px;text-align:right}
.chip .adj{display:flex;gap:2px}
.chip .adj button{background:var(--bg);border:1px solid var(--line);border-radius:6px;width:20px;height:20px;font-size:12px;line-height:1;color:var(--muted)}
.chip.sel{border-color:var(--gold);background:#fff8e3}
.chip.lead{border-color:var(--berry)}
.chip.try{opacity:.45}
/* question overlay */
.ov{position:fixed;inset:0;background:rgba(43,27,34,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}
.qcard{background:var(--card);border-radius:16px;max-width:900px;width:100%;max-height:94vh;overflow:auto;padding:26px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.qnom{font-family:Arial,sans-serif;color:var(--berry);font-weight:bold;font-size:18px}
.badge{font-family:Arial,sans-serif;font-size:12px;letter-spacing:.1em;background:var(--gold);color:#2B1B22;border-radius:999px;padding:4px 12px}
.qtext{font-size:clamp(17px,2.4vw,23px);line-height:1.5;margin-bottom:16px}
.qans{background:var(--bg);border-left:4px solid var(--berry);border-radius:8px;padding:12px 16px;margin:12px 0}
.qans b{color:var(--berry);font-size:18px}
.qans p{color:var(--muted);font-size:14.5px;margin-top:6px;line-height:1.55}
.qctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.qplayers{margin-top:14px}
.qplayers .pgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.note{color:var(--muted);font-size:13.5px;line-height:1.5;margin-top:8px}
input[type=number]{width:110px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:var(--bg);color:var(--ink)}
/* results table */
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{font-family:Arial,sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr.gold td{background:#fff6dd}
.medal{font-size:18px}
.footerbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
@media(max-width:640px){.board{grid-template-columns:minmax(90px,1fr) repeat(5,1fr)}.thm{min-height:44px}.cell{min-height:44px}}
</style>
</head>
<body>
<div class="center" id="app"></div>
<script>
// Данные турнира «Своя игра: Ярлыки» — 5 раундов × 5 тем × 5 вопросов + финал
// Формат вопроса: [текст, ответ, комментарий ведущему, спец|null]
const ROUNDS = [
{ title:'Классика жанра', base:100, themes:[
 {t:'Старые знакомые', q:[
  ['Не начинает работу без многократных напоминаний, бросает начатое, выбирает самое короткое задание, на уроке смотрит в окно или в телефон.','Лентяй','Главный ярлык-обманка словаря: за отказом начинать почти всегда стоит опыт неудачи — безопаснее не начинать, чем снова не справиться.',null],
  ['Тянет руку на каждый вопрос, выкрикивает ответ с места, первым вызывается на любое задание и заметно переживает, если выбрали другого.','Выскочка','Окружающих раздражают не ответы, а постоянное «я, я, я» — гипертрофированная потребность в признании.',null],
  ['Учит всё подряд и дословно, отвечает близко к тексту учебника, паникует при вопросе «а своими словами?», отказывается от прогулки перед контрольной.','Зубрилка','Ярлык наказывает ребёнка за старательность — и потому особенно несправедлив.',null],
  ['Роняет, разливает, разбивает; падает на ровном месте; слово закрепляется после двух-трёх заметных эпизодов — и дальше сопровождает каждый, даже случайный, промах.','Растяпа','Пример избыточной стабильности ярлыка: поведение эпизодично, имя постоянно.',null],
  ['Отвечает с паузой, последним заканчивает работу, не сразу понимает шутку, переспрашивает — а нередко понимает глубже всех.','Тормоз','Ярлык наказывает за темп — характеристику нейродинамики, которую человек не выбирает.',null]]},
 {t:'Тише воды', q:[
  ['Сидит на одном месте всю перемену, говорит только когда спросят, не участвует в шалостях и конфликтах, не просит и не жалуется.','Тихоня','В устах учителя звучит почти одобрительно («с ним нет хлопот») — и в этом ловушка: это маска «невидимки».',null],
  ['Краснеет и сбивается при ответе у доски, говорит тихо, не подходит первым, а на похвалу при всех реагирует как на наказание.','Стеснительный','Публичность для него — нагрузка, а не награда.',null],
  ['На перемене остаётся за партой с книгой, в большой компании молчит, дружит с одним-двумя. Единственный ярлык списка, который наука вообще не считает недостатком.','Интроверт','Нормальная характеристика темперамента, а не изъян. Иногда ярлык неправ целиком.',null],
  ['Отвечает односложно, сам разговор не начинает, в дискуссии отмалчивается, при прямом обращении смущается и сворачивает ответ.','Неразговорчивый','Пересекается с маской «невидимки»: не проявляться — способ не попасть под удар.',null],
  ['Не поднимает руку, не предлагает ничего в групповой работе, делает ровно то, что сказано; на вопрос «что ты сам хочешь?» пожимает плечами.','Безынициативный (пассивный)','Часто это не отсутствие желаний, а выученная осторожность: инициатива когда-то наказывалась.',null]]},
 {t:'Громкие роли', q:[
  ['Кривляется у доски, передразнивает интонации, отвечает так, чтобы рассмеялся класс, срывает серьёзные моменты репликой.','Клоун (шут)','Маска «клоунада»: быть смешным безопаснее, чем быть неуспешным — смеются по его сценарию.',null],
  ['Говорит много и без пауз, перебивает, комментирует всё происходящее вслух; собеседнику трудно вставить слово.','Болтливый','Простое описание поведения — редкий случай ярлыка почти без второго дна.',null],
  ['Отвечает раньше, чем спросили, поправляет одноклассников и учителя, к каждой теме добавляет «а я читал, что…».','Всезнайка','Знания предъявляет как превосходство, а не как вклад в общий разговор.',null],
  ['Рассказывает о покупках, поездках, оценках и подписчиках с расчётом на реакцию, преувеличивает, чужие достижения перебивает своими.','Хвастун','Сравнение всегда в свою пользу: «а у меня лучше».',null],
  ['Реагирует на отказ или двойку слезами, криком, хлопаньем дверью; эмоция вспыхивает мгновенно и непропорционально поводу.','Истеричка','Ярлык, как правило, достаётся девочкам и фиксирует не «характер», а несформированную саморегуляцию — сигнал для взрослого.','КОТ В МЕШКЕ']]},
 {t:'Трудные характеры', q:[
  ['Жалуется до начала дела: «опять контрольная», «у меня не получится», «почему всегда я»; энергия уходит в жалобу, а не в действие.','Нытик','В любом событии первым находит плохое.',null],
  ['Вспыхивает от мелочи: огрызается на просьбу подвинуться, хлопает учебником; после вспышки быстро остывает, но осадок у окружающих накапливается.','Раздражительный','Короткая вспышка — длинный след.',null],
  ['При любом изменении планов задаёт тревожные вопросы по кругу («а вдруг…», «а если…»), заражает беспокойством соседей, преувеличивает последствия.','Паникёр','Перед контрольной накручивает не только себя, но и других.',null],
  ['В любом плане первым называет причины, по которым ничего не выйдет; успех объясняет случайностью, неудачу — закономерностью.','Пессимист','Фирменная реплика: «да кому это надо».',null],
  ['Не меняет решения после контраргументов, спорит из принципа, «нет» говорит раньше, чем выслушает.','Упёртый (упрямый)','Ключ из тетради: часто это не спор о предмете, а борьба за право выбирать — дефицит контроля.',null]]},
 {t:'Угадай по трём признакам', q:[
  ['Мятая одежда — неубранный портфель — парта в обрезках и крошках.','Грязнуля','Для педагога устойчивая неопрятность — не повод для клейма, а наблюдаемый факт, который может говорить о домашней ситуации.',null],
  ['Спрятанный ластик — неодолженная ручка — последнее и минимальное участие в складчине.','Жадный','Не делится и не даёт своего.',null],
  ['Забытая сменка — потерянный листок с заданием — портфель, который собирается, когда уже пора выходить.','Неорганизованный (несобранный)','Дела делаются в случайном порядке, и ни одно не доводится к сроку.','АУКЦИОН'],
  ['Пропущенное условие задачи — ошибки «на ровном месте» — потерянные вещи.','Невнимательный','Устойчивая рассеянность — повод не для замечаний, а для вопроса, чем на самом деле занята голова ребёнка.',null],
  ['Переспрашивает объяснённое — путает порядок действий — старается, и всё равно делает не то.','Бестолковый','Ярлык фиксирует результат, но прячет причину: перегрузку, тревогу или пробел в базовых знаниях.',null]]}
]},
{ title:'Новый словарь', base:200, themes:[
 {t:'Сленг для начинающих', q:[
  ['Поправляет мелкие ошибки, требует соблюдения правил там, где все договорились их не замечать, продолжает спор, когда всем стало скучно, объясняет шутку.','Душнила','Самый частотный ярлык собранного словаря. «Душнилой» можно стать, просто оказавшись правым не вовремя.',null],
  ['Так называют того, кто вызывает «испанский стыд»: ведёт себя не по ситуации и не замечает этого — шутит несмешное, использует устаревший сленг, слишком старается понравиться.','Кринж (кринжовый)','Ярлык фиксирует не поведение, а реакцию зрителей.',null],
  ['Не характеристика поведения, а роль в чужих чувствах: человек, который нравится. Этот «статус» получают без всякого собственного действия.','Краш','За внешность, манеру держаться, голос.',null],
  ['Обесценивает («ничего особенного»), язвит под видом честности, давит на чувство вины; после общения с ним остаётся усталость и ощущение собственной никчёмности.','Токсик (токсичный)','Слово стало универсальным упрёком — им всё чаще метят любого неудобного собеседника.',null],
  ['Добивается внимания, принижая себя или «своих»: «я не такая, как все девочки», наперебой соглашается, выслуживается перед популярными.','Пикми','От англ. pick me — «выбери меня». За показной скромностью — громкая заявка на исключительность.',null]]},
 {t:'Из игр и сети', q:[
  ['«Фоновый» человек: отвечает заученными фразами, не имеет своего мнения, действует по шаблону. Название — из видеоигр.','НПС (NPC)','Non-player character. Один из самых обесчеловечивающих ярлыков словаря: отказывает не в качестве, а в субъектности.',null],
  ['Изображает жизнь, которой не живёт: «отыгрывает» богатство, связи, суровый опыт. Название — из ролевых игр живого действия.','Ларпер (ларп)','Live action role play. Несоответствие образа и реальности рано или поздно вскрывается.',null],
  ['Заваливает чат сообщениями не по делу: пересылает десятки картинок, пишет односложные реплики подряд; важное в его потоке тонет.','Флудер','От flood — «наводнение».',null],
  ['Намеренно публикует абсурдный, низкокачественный контент; юмор строится на самой нелепости. От флудера отличается осознанностью жанра.','Щитпостер','Жанровое интернет-слово: нелепость здесь — художественный приём.',null],
  ['Пишет и говорит то, что выведет из себя, ради самой реакции; добившись вспышки, отступает со словами «да я же шучу».','Тролль','Спор для него — развлечение, а не поиск правоты.','КОТ В МЕШКЕ']]},
 {t:'Свои и чужие', q:[
  ['Одеждой, причёской, музыкой и символикой демонстрирует принадлежность к субкультуре и непринадлежность к большинству.','Нефор','Сокращение от «неформал». Описывает внешнюю презентацию, а не поступки.',null],
  ['Человек без выраженных особенностей: массовые вкусы, предсказуемые реакции, «как все». В устах субкультурных подростков звучит снисходительно.','Нормис','За словом почти нет поведения — есть отсутствие отличий.',null],
  ['Носит атрибутику субкультуры, не зная её содержания, цитирует группу, не слушая её альбомов; «своими» распознаётся и отторгается.','Позер','Имитация принадлежности знаками.',null],
  ['«Настоящий, подлинный»: тот, чья принадлежность — к субкультуре, увлечению, дружбе — подтверждена делом, а не атрибутикой.','Тру','От англ. true. Антоним позёра и ларпера.',null],
  ['Во всём придерживается одобряемых группой «правильных» взглядов и вкусов: повторяет общепринятые мнения, слушает то, что все, носит то, что все.','Базовичок','От слова «база». Звучит и одобрительно, и с иронией — «без собственной позиции».',null]]},
 {t:'Образы и позы', q:[
  ['Образ «одинокого волка»: демонстративно независим, держится вне компаний и как бы над ними, равнодушен к мнению группы.','Сигма','В подростковой практике чаще означает не реальную самодостаточность, а её старательное изображение.',null],
  ['«Мёртвый внутри»: тёмная одежда, грустные статусы, подчёркнутое равнодушие, эстетизация тоски.','Дед инсайд','Важно различать позу субкультуры и реальные признаки депрессивного состояния (об этом — в раунде 5).',null],
  ['Носитель уныло-обречённого взгляда на будущее: «всё бессмысленно, ничего не изменить»; не строит планов, романтизирует собственную тоску.','Думер','От англ. doom — «гибель, рок».',null],
  ['Обидное слово о взрослом, опустившем планку: неухоженность, диван, раздражительность, «раньше было лучше». Подростки переносят его и на сверстников.','Скуф','Переносится на сверстников за неопрятность и «стариковское» брюзжание.','АУКЦИОН'],
  ['Образ напористого, физически уверенного «альфы»: качается, легко знакомится, не сомневается в себе. Употребляется и с восхищением, и с иронией.','Чад','Ирония направлена на сам стереотип «альфы».',null]]},
 {t:'Отношения и флаги', q:[
  ['Не человек, а признак: поведение, которое группа договорилась считать предупреждением об опасности в отношениях — ревнует, проверяет телефон, не принимает «нет».','Ред флаг','«Ходячим ред флагом» называют того, у кого таких признаков много.',null],
  ['Антоним предыдущего: тот, чьё поведение группа считает признаком надёжности — отвечает на сообщения, держит слово, спокойно принимает отказ.','Гринфлаг','Редкий пример одобрительного ярлыка с поведенческим содержанием.',null],

  ['Почему дальние парты в классе называют именно «Камчаткой»?','Самый дальний край страны','Дальняя окраина карты стала дальней окраиной класса: туда «ссылают». Образ встречается в русской литературе с XIX века.',null],

 {t:'Слова с биографией', q:[
  ['Этот сериал вернул в школьные коридоры слово «чушпан».','«Слово пацана»','Экран реанимировал лексику уличных иерархий сорокалетней давности.',null],
  ['В какой стране и за что слово «тунеядец» было официальным клеймом с правовыми последствиями?','В СССР — за «жизнь без общественно полезного труда»','Административное преследование «ведущих паразитический образ жизни». В учительской речи слово пережило свою эпоху.',null],

{ title:'Механика ярлыка', base:400, themes:[
 {t:'Почувствуйте разницу', q:[
  ['Оба не делают вовремя, но один в последний момент всё-таки делает — ценой ночного аврала. Разведите пару «лентяй — прокрастинатор».','Прокрастинатор делает в последний момент','Его проблема — старт, а не усилие.',null],
  ['Зануда и душнила ведут себя почти одинаково. Какое отличие добавляет новый ярлык к старому?','Душнилой объявляют и правого не вовремя','«Душнила» фиксирует реакцию группы, а не только поведение.',null],
  ['Позер и ларпер оба изображают то, чем не являются. В чём разница?','Атрибутика — против целой биографии','Позер имитирует знаками: мерч, цитаты, вид. Ларпер отыгрывает жизнь целиком.',null],

  ['«Чмошник» и «чушпан» — оба о «низшем». В чём системное различие?','«Чушпан» приносит целую иерархию','«Чмошник» — назначенный низший внутри обычного класса. «Чушпан» — знак того, что класс заимствовал криминальную логику «пацан — не пацан».',null]]},
 {t:'Маски и дефициты', q:[
  ['Классный клоун получает смех «по собственному сценарию». Какой дефицит закрывает клоунада?','Дефицит значимости','Быть смешным безопаснее, чем быть неуспешным.',null],
  ['Какая маска, по рабочей тетради, прячется за ярлыком «лентяй»?','Апатия','Не начинать безопаснее, чем снова не справиться: опыт многократной неудачи.',null],
  ['«Упёртый» спорит по мелочам, но спор идёт не о предмете. За что он борется на самом деле?','За право выбирать (дефицит контроля)','Закрывается выбором из двух вариантов, правом на «пропуск хода».',null],

 {t:'Пять механизмов', q:[

  ['«Будущий дворник» выдаётся не за поведение, а за отметки — и назначает ребёнку будущее. Назовите механизм.','(Самосбывающееся) пророчество','Школьная проекция эффекта ожиданий; работает в обе стороны.',null],

  ['«Камчатка» и «галёрка» показывают, что клеймом может стать даже не слово о человеке. А что?','Место (именование через место)','Сначала туда отсаживают, затем само место начинает объяснять поведение сидящих.',null],

 {t:'Что делать педагогу', q:[
  ['Назовите три вопроса «обратного перевода» ярлыка.','Поведение? Функция? Дефицит?','Какое наблюдаемое поведение стоит за словом; в каких ситуациях и что за ним следует; какой дефицит или маска за этим стоят.',null],
  ['Каким правилом словарь предлагает заменить реплику «ты лентяй»?','«Факт вместо оценки»','Вместо «ты лентяй» — «за сорок минут написаны две строки; что мешает?». Первая формула закрывает разговор, вторая открывает.',null],
  ['Чем педагог «обесточивает» маску клоунады?','Легальной заметной ролью','Ведущий, помощник, объявляющий этап: смех и внимание — законным способом.',null],
  ['Почему публичное замечание классному клоуну усиливает маску, а не снимает её?','Даёт ту самую заметность','Замечание при всех — тоже сцена: цель клоунады достигнута.',null],
  ['Единственный механизм ярлыка, у которого есть административный рычаг. Назовите механизм и рычаг.','Именование через место; рассадка','Пересадка клейма не снимает, но разрушает его материальную опору и лишает образ ежедневного подтверждения.','АУКЦИОН']]},
 {t:'Слово учителя', q:[
  ['Почему учительский ярлык весит несопоставимо больше детского?','Произнесён властью, публично','Детский ярлык — слово равного; учительский назначает роль с позиции институциональной власти, и ребёнок не может его ни оспорить, ни переиграть.',null],
  ['Формула «одни и те же лица» звучит в двух противоположных ситуациях. В каких?','О нарушителях — и об активных','В обоих случаях закрепляет распределение ролей: нарушителям — «другого не ждут», активным — «участие обесценено».',null],
  ['Чему на самом деле учит ребёнка насмешка «ну, жених»?','Скрывать привязанность','Первое чувство публично выставлено на осмеяние. Поведения, которое нужно «исправлять», здесь нет вовсе.',null],

]},

  ['«Жди сват»: что стоит за этой угрозой?','Сваттинг — ложный вызов экстренных служб','Вторая формула угрозы из красной зоны словаря; также имеет правовую оценку.',null],

 {t:'Хроника сленга', q:[

 {t:'Коллективные клейма', q:[

 {t:'Тонкие случаи', q:[
  ['Единственный безусловно положительный ярлык словаря — и его цена.','«Ответственный»; ему нельзя устать и отказаться','Даже одобрительный ярлык управляет человеком: всё чаще поручают — всё реже решается подвести.',null],
  ['«Железная леди»: в чём двойное действие этого ярлыка?','Уважение — и отчуждение','За «железом» окружающие перестают видеть живого человека.',null],
  ['Что на самом деле фиксирует ярлык «истеричка» — и чем это является для взрослого?','Несформированную саморегуляцию; сигналом','Не «характер», а навык, который не сложился, — то есть зона помощи.',null],
  ['«Тормоз» и «тюбик» объединяет одно: за что наказывают оба ярлыка?','За то, что человек не выбирает','Темп — характеристика нейродинамики, конституция и темперамент — данность.',null],
  ['У ярлыка «глупый» самое бедное поведенческое содержание из всех классических — и самая высокая разрушительность. Почему?','Он атакует представление о своих возможностях','Слово-приговор способностям: получают его всего лишь за медленный темп.','АУКЦИОН']]},
 {t:'Философия словаря', q:[
  ['По какой единой формуле построена каждая статья студенческого словаря?','«Так называют того, кто…»','Дальше — только наблюдаемые проявления, без диагнозов и без оценки правоты окружающих.',null],
  ['Почему от мема-дразнилки невозможно избавиться, «ведя себя лучше»?','Исправлять нечего: поведенческого референта нет','Прозвище родилось из случайности и держится на повторении: группа смеётся над узнаванием, а не над смыслом.',null],
  ['Почему у «саб3», «марар» и «палитры» в словаре нет определений?','Локальный язык, закрытый для внешнего наблюдателя','Значение известно только участникам группы. Это граница самого словарного метода.',null],
  ['Словарь объясняет, «что значит слово». О чём он при этом молчит — и что восполняет студенческий словарь?','О том, что слово делает с ребёнком','Перевод значений не равен пониманию практики: педагогическая интерпретация — недостающий шаг.',null],
  ['Какой словарь, по итогам всей работы, первым нуждается в ревизии?','Словарь самого педагога','Подростковый сленг педагог наблюдает и мягко корректирует; собственную речь — контролирует полностью.',null]]}
]}
];
const FINAL = {
 theme:'Сила слова',
 q:'Ярлык, по словарю, избыточно стабилен, ленив и не может быть оспорен ребёнком, если произнесён властью. Назовите единственный словарь школьной речевой среды, который педагог контролирует полностью.',
 a:'Собственный словарь (свою речь)',
 c:'Подростковый сленг педагог наблюдает и мягко корректирует, детские дразнилки переводит в поведение и функцию — и только собственную речь контролирует целиком. Поэтому ревизия словаря взрослого — первый шаг всей работы с ярлыками.'
};

</script>
<script>
'use strict';
const LSKEY='yarlyki-turnir-v1';
let S=null;
function save(){try{localStorage.setItem(LSKEY,JSON.stringify(S));}catch(e){}}
function load(){try{const x=localStorage.getItem(LSKEY);return x?JSON.parse(x):null;}catch(e){return null;}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function nom(r,qi){return ROUNDS[r].base*(qi+1);}
const app=document.getElementById('app');

function newState(names){
 return {stage:'round',round:0,players:names.map(n=>({name:n,score:0})),
  used:ROUNDS.map(()=>({})),q:null,final:null};
}

/* ---------- SETUP ---------- */
function renderSetup(prefill){
 const saved=load();
 app.innerHTML=`
 <div class="topbar"><h1>СВОЯ ИГРА: ЯРЛЫКИ · ТУРНИР</h1></div>
 <div class="panel">
  <p class="hint"><b>Личный зачёт до 24 участников · 5 раундов + финал · ориентировочно 3–3,5 часа.</b><br>
  Впишите имена участников — по одному в строке (от 2 до 24).</p>
  <textarea id="names" placeholder="Анна
Борис
Вера
...">${esc(prefill||'')}</textarea>
  <details>
   <summary>Правила и хронометраж для ведущего</summary>
   <p>Каждый играет сам за себя, счёт накапливается через все раунды. Отвечает тот, кто первым поднял руку: ведущий выбирает его карточку и отмечает «Верно» (+номинал) или «Неверно» (−номинал); после неверного ответа вопрос можно передать другому. Кнопки «±» на карточке — ручная корректировка (частичный зачёт).</p>
   <p><b>Кот в мешке</b>: игрок, открывший вопрос, обязан передать его любому другому участнику — отвечает только получатель. <b>Аукцион</b>: вопрос разыгрывается в торгах; ведущий вводит ставку победителя торгов (не ниже номинала, не выше его счёта, при счёте ниже номинала — ва-банк либо номинал).</p>
   <p><b>Финал</b>: участники с положительным счётом втайне пишут ставки на листках; ведущий вносит их в таблицу, открывает вопрос и отмечает, кто ответил верно.</p>
   <p><b>Хронометраж на 3 часа</b>: раунды 1–2 — по 30 мин; перерыв 10 мин; раунды 3–4 — по 35 мин; раунд 5 — 35 мин; финал и награждение — 15 мин. Сложность и номиналы растут от раунда к раунду, поэтому интрига сохраняется до конца.</p>
  </details>
  <div class="qctl">
   <button class="btn" id="start">Начать турнир</button>
   ${saved&&saved.stage!=='setup'?'<button class="btn sec" id="resume">Продолжить сохранённую игру</button>':''}
  </div>
 </div>`;
 document.getElementById('start').onclick=()=>{
  const names=document.getElementById('names').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(names.length<2){alert('Нужно не меньше двух участников.');return;}
  if(names.length>24){alert('Не больше 24 участников.');return;}
  S=newState(names);save();renderRound();
 };
 const rb=document.getElementById('resume');
 if(rb)rb.onclick=()=>{S=saved;route();};
}

/* ---------- PLAYERS PANEL ---------- */
function chipHtml(i,opts){
 const p=S.players[i];const o=opts||{};
 const cls=['chip',o.sel===i?'sel':'',o.tried&&o.tried.includes(i)?'try':'',o.lead===i?'lead':''].join(' ');
 return `<div class="${cls}" data-i="${i}">
   <b title="${esc(p.name)}">${esc(p.name)}</b>
   <span class="sc">${p.score}</span>
   ${o.adjust?`<span class="adj"><button data-a="-${o.step}" data-i="${i}">−</button><button data-a="${o.step}" data-i="${i}">+</button></span>`:''}
 </div>`;
}
function bindAdjust(root){
 root.querySelectorAll('.adj button').forEach(b=>{
  b.onclick=e=>{e.stopPropagation();const i=+b.dataset.i;S.players[i].score+=+b.dataset.a;save();
   root.querySelectorAll(`.chip[data-i="${i}"] .sc`).forEach(s=>s.textContent=S.players[i].score);};
 });
}

/* ---------- ROUND BOARD ---------- */
function renderRound(){
 const r=S.round,R=ROUNDS[r];
 let cells='';
 R.themes.forEach((th,ti)=>{
  cells+=`<div class="thm">${esc(th.t)}</div>`;
  th.q.forEach((q,qi)=>{
   const key=ti+'-'+qi,done=S.used[r][key];
   cells+=`<button class="cell${done?' done':''}" data-k="${key}" ${done?'disabled':''}>${done?'—':nom(r,qi)}</button>`;
  });
 });
 const leader=S.players.reduce((m,p,i)=>p.score>S.players[m].score?i:m,0);
 app.innerHTML=`
 <div class="topbar">
  <h1>СВОЯ ИГРА: ЯРЛЫКИ</h1>
  <div class="rtitle">Раунд ${r+1} из 5 · «${esc(R.title)}» · номиналы ${R.base}–${R.base*5}</div>
 </div>
 <div class="board">${cells}</div>
 <div class="pgrid" id="pp">${S.players.map((_,i)=>chipHtml(i,{adjust:true,step:R.base,lead:leader})).join('')}</div>
 <div class="footerbar">
  <button class="btn sec" id="reset">Сбросить игру</button>
  <button class="btn" id="endround">Завершить раунд ${r+1} →</button>
 </div>`;
 bindAdjust(document.getElementById('pp'));
 app.querySelectorAll('.cell:not(.done)').forEach(c=>c.onclick=()=>openQ(c.dataset.k));
 document.getElementById('endround').onclick=()=>{renderStandings();};
 document.getElementById('reset').onclick=()=>{if(confirm('Начать турнир заново? Текущие результаты будут стёрты.')){try{localStorage.removeItem(LSKEY);}catch(e){}renderSetup(S.players.map(p=>p.name).join('\n'));}};
}

/* ---------- QUESTION ---------- */
function openQ(key){
 const [ti,qi]=key.split('-').map(Number);
 S.q={key,ti,qi,sel:null,tried:[],revealed:false,bet:null,resolved:false};
 renderQ();
}
function renderQ(){
 const r=S.round,{ti,qi,sel,tried,revealed,resolved}=S.q;
 const Q=ROUNDS[r].themes[ti].q[qi],N=nom(r,qi),spec=Q[3];
 const isCat=spec==='КОТ В МЕШКЕ',isAuc=spec==='АУКЦИОН';
 const stake=isAuc?(S.q.bet==null?N:S.q.bet):N;
 let html=`<div class="ov"><div class="qcard">
  <div class="qhead">
   <span class="qnom">${esc(ROUNDS[r].themes[ti].t)} · ${N}</span>
   ${spec?`<span class="badge">${spec}</span>`:''}
  </div>`;
 if(isCat&&!revealed)html+=`<p class="note">Вопрос обязан быть передан: игрок, открывший его, выбирает, кто будет отвечать. Отвечает только получатель: верно +${N}, неверно −${N}.</p>`;
 if(isAuc&&!revealed)html+=`<p class="note">Торги! Ставка — не ниже номинала и не выше счёта игрока (при счёте ниже номинала — номинал или ва-банк). Введите ставку победителя торгов и выберите его карточку.</p>`;
 html+=`<div class="qtext">${esc(Q[0])}</div>`;
 if(revealed)html+=`<div class="qans"><b>${esc(Q[1])}</b><p>${esc(Q[2])}</p></div>`;
 if(!resolved){
  html+=`<div class="qctl">`;
  if(isAuc)html+=`<label class="note">Ставка: <input type="number" id="bet" min="${N}" step="100" value="${stake}"></label>`;
  html+=`<button class="btn good" id="ok" ${sel==null?'disabled':''}>Верно +${stake}</button>
   <button class="btn bad" id="no" ${sel==null?'disabled':''}>Неверно −${stake}</button>
   ${revealed?'':'<button class="btn sec" id="show">Показать ответ</button>'}
   <button class="btn sec" id="skip">Никто не ответил</button></div>
  <div class="qplayers"><p class="note">${isCat?'Кому передан вопрос:':'Кто отвечает:'}</p>
   <div class="pgrid">${S.players.map((_,i)=>chipHtml(i,{sel,tried})).join('')}</div></div>`;
 }else{
  html+=`<div class="qctl"><button class="btn" id="close">К табло →</button></div>`;
 }
 html+=`</div></div>`;
 app.insertAdjacentHTML('beforeend',html);
 const ov=app.querySelector('.ov');
 if(!resolved){
  ov.querySelectorAll('.qplayers .chip').forEach(c=>c.onclick=()=>{
   const i=+c.dataset.i;if(tried.includes(i))return;S.q.sel=i;rerenderQ();});
  const betEl=ov.querySelector('#bet');
  const okB=ov.querySelector('#ok'),noB=ov.querySelector('#no');
  const curStake=()=>{if(!isAuc||!betEl)return N;const v=Math.round((+betEl.value||0)/100)*100;return Math.max(N,v);};
  if(betEl)betEl.oninput=()=>{const v=curStake();S.q.bet=v;okB.textContent='Верно +'+v;noB.textContent='Неверно −'+v;};
  okB.onclick=()=>{S.players[S.q.sel].score+=curStake();finishQ(true);};
  noB.onclick=()=>{
   S.players[S.q.sel].score-=curStake();
   if(isCat||isAuc){finishQ(false);}
   else{S.q.tried.push(S.q.sel);S.q.sel=null;save();rerenderQ();}
  };
  const sh=ov.querySelector('#show');
  if(sh)sh.onclick=()=>{S.q.revealed=true;rerenderQ();};
  ov.querySelector('#skip').onclick=()=>{S.q.revealed=true;finishQ(null);};
 }else{
  ov.querySelector('#close').onclick=()=>{ov.remove();S.q=null;save();renderRound();};
 }
}
function rerenderQ(){const ov=app.querySelector('.ov');if(ov)ov.remove();renderQ();}
function finishQ(){
 S.q.revealed=true;S.q.resolved=true;
 S.used[S.round][S.q.key]=true;save();rerenderQ();
}

/* ---------- STANDINGS ---------- */
function renderStandings(){
 const r=S.round,last=r>=ROUNDS.length-1;
 const sorted=S.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score);
 app.innerHTML=`
 <div class="topbar"><h1>Итоги после раунда ${r+1}</h1></div>
 <div class="panel">
  <table><tr><th>№</th><th>Участник</th><th>Очки</th></tr>
  ${sorted.map((p,n)=>`<tr${n===0?' class="gold"':''}><td>${n+1}</td><td>${esc(p.name)}</td><td><b>${p.score}</b></td></tr>`).join('')}
  </table>
  <div class="footerbar">
   <button class="btn sec" id="back">← Вернуться к табло</button>
   <button class="btn" id="next">${last?'Перейти к финалу →':'Раунд '+(r+2)+' →'}</button>
  </div>
 </div>`;
 document.getElementById('back').onclick=renderRound;
 document.getElementById('next').onclick=()=>{
  if(last){S.final={bets:S.players.map(p=>p.score>0?0:null),opened:false,marks:S.players.map(()=>null),done:false};S.stage='final';save();renderFinal();}
  else{S.round++;save();renderRound();}
 };
}

/* ---------- FINAL ---------- */
function renderFinal(){
 const F=S.final;
 const canPlay=i=>S.players[i].score>0;
 app.innerHTML=`
 <div class="topbar"><h1>ФИНАЛ</h1><div class="rtitle">Тема: «${esc(FINAL.theme)}»</div></div>
 <div class="panel">
  ${!F.opened?`
   <p class="hint">Участвуют игроки с положительным счётом. Каждый втайне пишет ставку на листке (от 0 до своего счёта), затем ведущий вносит ставки и открывает вопрос.</p>
   <table><tr><th>Участник</th><th>Очки</th><th>Ставка</th></tr>
   ${S.players.map((p,i)=>`<tr><td>${esc(p.name)}</td><td>${p.score}</td><td>${canPlay(i)?`<input type="number" class="fbet" data-i="${i}" min="0" max="${p.score}" step="100" value="${F.bets[i]||0}">`:'<span class="note">не участвует</span>'}</td></tr>`).join('')}
   </table>
   <div class="footerbar"><span></span><button class="btn gold" id="open">Открыть вопрос финала</button></div>`
  :`
   <div class="qtext">${esc(FINAL.q)}</div>
   ${F.done?`<div class="qans"><b>${esc(FINAL.a)}</b><p>${esc(FINAL.c)}</p></div>`:''}
   <p class="hint">${F.done?'Ставки применены.':'Выслушайте ответы (письменно, затем вслух по возрастанию счёта) и отметьте, кто ответил верно. Затем нажмите «Показать ответ и применить ставки».'}</p>
   <table><tr><th>Участник</th><th>Очки</th><th>Ставка</th><th>Ответ</th></tr>
   ${S.players.map((p,i)=>`<tr><td>${esc(p.name)}</td><td>${p.score}</td><td>${F.bets[i]==null?'—':F.bets[i]}</td>
    <td>${F.bets[i]==null?'—':(F.done?(F.marks[i]?'✓':'✗'):`<button class="btn ${F.marks[i]?'good':'sec'}" data-m="1" data-i="${i}">верно</button>
      <button class="btn ${F.marks[i]===false?'bad':'sec'}" data-m="0" data-i="${i}">неверно</button>`)}</td></tr>`).join('')}
   </table>
   <div class="footerbar"><span></span>${F.done?'<button class="btn gold" id="res">Итоги турнира →</button>':'<button class="btn" id="apply">Показать ответ и применить ставки</button>'}</div>`}
 </div>`;
 if(!F.opened){
  document.getElementById('open').onclick=()=>{
   document.querySelectorAll('.fbet').forEach(inp=>{
    const i=+inp.dataset.i;F.bets[i]=Math.min(Math.max(0,Math.round(+inp.value)||0),S.players[i].score);});
   F.opened=true;save();renderFinal();};
 }else if(!F.done){
  app.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{F.marks[+b.dataset.i]=b.dataset.m==='1';save();renderFinal();});
  document.getElementById('apply').onclick=()=>{
   S.players.forEach((p,i)=>{if(F.bets[i]!=null&&F.marks[i]!=null)p.score+=F.marks[i]?F.bets[i]:-F.bets[i];});
   F.done=true;save();renderFinal();};
 }else{
  document.getElementById('res').onclick=()=>{S.stage='results';save();renderResults();};
 }
}

/* ---------- RESULTS ---------- */
function renderResults(){
 const sorted=S.players.map(p=>({...p})).sort((a,b)=>b.score-a.score);
 const medals=['🥇','🥈','🥉'];
 app.innerHTML=`
 <div class="topbar"><h1>ИТОГИ ТУРНИРА</h1></div>
 <div class="panel">
  <table><tr><th></th><th>Участник</th><th>Очки</th></tr>
  ${sorted.map((p,n)=>`<tr${n<3?' class="gold"':''}><td class="medal">${medals[n]||n+1}</td><td>${esc(p.name)}</td><td><b>${p.score}</b></td></tr>`).join('')}
  </table>
  <p class="hint" style="margin-top:14px">Спасибо за игру! Словарь ярлыков — повод не для смеха над словами, а для разговора о том, что слова делают с людьми.</p>
  <div class="footerbar">
   <button class="btn sec" id="again">Новый турнир</button><span></span>
  </div>
 </div>`;
 document.getElementById('again').onclick=()=>{try{localStorage.removeItem(LSKEY);}catch(e){}renderSetup(S.players.map(p=>p.name).join('\n'));};
}

function route(){
 if(!S){renderSetup();return;}
 if(S.stage==='final'){renderFinal();return;}
 if(S.stage==='results'){renderResults();return;}
 renderRound();
}
renderSetup();
</script>
</body>
</html>
